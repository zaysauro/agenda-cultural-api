name: Update Cinema

on:
  push:
    branches: ["main"]
    paths:
      - "scraper/scrape.py"
      - "scraper/update_cinema.py"
      - ".github/workflows/update-cinema.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cinema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate cinema feed
        working-directory: scraper
        run: python update_cinema.py

      - name: Publish cinema feed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/cinema.json
          git commit -m "Update cinema data" || echo "No changes to commit"
          git push
